<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hệ thống cảnh báo ngập lụt</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
  height:100vh;
  overflow:hidden;
}

/* HEADER */
.header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1e293b;
  font-size:22px;
  font-weight:bold;
}

/* MAIN GRID */
.main{
  display:grid;
  grid-template-columns: 320px 1fr;
  height:calc(100vh - 60px);
  gap:15px;
  padding:15px;
}

/* LEFT PANEL */
.left{
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* CARD STYLE */
.card{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
  text-align:center;
}

/* GAUGE */
#riverBox{
  width:100px;
  height:220px;
  border:3px solid #94a3b8;
  margin:10px auto;
  position:relative;
  border-radius:8px;
  overflow:hidden;
}

#water{
  position:absolute;
  bottom:0;
  width:100%;
  background:linear-gradient(to top,#2563eb,#60a5fa);
  height:0%;
  transition:0.5s;
}

/* TEXT */
.valueBig{
  font-size:24px;
  margin-top:10px;
}

/* STATUS */
.status{
  font-size:18px;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  margin:10px 0;
}

.safe{background:#16a34a;}
.warning{background:#facc15;color:black;}
.danger{background:#dc2626;animation:blink 1s infinite;}

@keyframes blink{
  50%{opacity:0.5;}
}

/* RIGHT PANEL (CHART) */
.right{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
}

/* CHART BOX */
.chartBox{
  flex:1;
  position:relative;
}

.chartBox canvas{
  width:100% !important;
  height:100% !important; /* 🔥 FIX CHART */
}

/* TITLE */
.card h3, .right h3{
  margin:5px 0 10px;
  font-size:18px;
  color:#cbd5f5;
}
</style>
</head>

<body>

<div class="header">
🌊 HỆ THỐNG CẢNH BÁO NGẬP LỤT
</div>

<div class="main">

  <!-- LEFT -->
  <div class="left">

    <div class="card">
      <h3>Mực nước</h3>
      <div id="riverBox">
        <div id="water"></div>
      </div>
      <div class="valueBig" id="waterValue">0 cm</div>
    </div>

    <div class="card">
      <h3>Trạng thái</h3>
      <div id="statusBox" class="status safe">AN TOÀN</div>
      <p>Giá trị ADC: <span id="adcValue">0</span></p>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">
    <h3>Biểu đồ mực nước (Realtime)</h3>
    <div class="chartBox">
      <canvas id="chart"></canvas>
    </div>
  </div>

</div>

<script>

const TOKEN = "rdP1f15mGDbn17U9FV0ITcGh6XNTmMol";

// ===== BIỂU ĐỒ =====
let ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx,{
  type:'line',
  data:{
    labels:[],
    datasets:[{
      label:'Mực nước (cm)',
      data:[],
      borderColor:'#3b82f6',
      borderWidth:3,
      fill:false,
      tension:0.3
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false, // 🔥 QUAN TRỌNG
    scales:{
      y:{min:0,max:10}
    }
  }
});

// ===== HÀM LẤY DATA AN TOÀN =====
async function getBlynk(pin){
  let res = await fetch(`https://blynk.cloud/external/api/get?token=${TOKEN}&${pin}`);
  let text = await res.text();

  if(text.includes("Invalid token")){
    throw new Error("Token không hợp lệ");
  }

  try{
    let parsed = JSON.parse(text);
    return parsed[0];
  }catch{
    return text;
  }
  return text.trim();
}

// ===== FETCH =====
async function updateData(){

  try{
    let adc = await getBlynk("v0");

    adc = Number(adc);

    let waterLevel = (adc / 4095) * 10;

    document.getElementById("adcValue").innerText = adc;
    document.getElementById("waterValue").innerText = waterLevel.toFixed(1) + " cm";

    let percent = (waterLevel / 10) * 100;
    document.getElementById("water").style.height = percent + "%";

    let statusBox = document.getElementById("statusBox");

    if(waterLevel < 3){
      statusBox.innerText = "AN TOÀN";
      statusBox.className = "status safe";
    }
    else if(waterLevel < 7){
      statusBox.innerText = "CẢNH BÁO";
      statusBox.className = "status warning";
    }
    else{
      statusBox.innerText = "NGUY HIỂM";
      statusBox.className = "status danger";
    }

    let time = new Date().toLocaleTimeString();

    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(waterLevel);

    if(chart.data.labels.length > 15){
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }

    chart.update();

  }catch(err){
    console.error(err);
  }

}

// ===== LOOP =====
setInterval(updateData,2000);

</script>

</body>
</html>
