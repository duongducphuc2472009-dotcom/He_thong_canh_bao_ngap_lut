<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
  height:100vh;
  overflow:hidden; /* không scroll */
}

/* HEADER */
.header{
  padding:15px;
  background:#1e293b;
  font-size:24px;
  font-weight:bold;
  text-align:center;
}

/* LAYOUT MỚI */
.wrapper{
  display:flex;
  height:calc(100vh - 70px);
}

/* LEFT */
.grid{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
  width:320px;
}

/* CARD */
.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  width:260px;
  text-align:center;
}

/* GAUGE */
#riverBox{
  width:120px;
  height:250px;
  border:3px solid white;
  margin:auto;
  position:relative;
}

#water{
  position:absolute;
  bottom:0;
  width:100%;
  background:linear-gradient(to top,#2563eb,#60a5fa);
  height:0%;
  transition:0.5s;
}

/* STATUS */
.status{
  font-size:20px;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
}

.safe{background:#16a34a;}
.warning{background:#facc15;color:black;}
.danger{background:#dc2626;animation:blink 1s infinite;}

@keyframes blink{
  50%{opacity:0.5;}
}

.valueBig{
  font-size:28px;
  margin:10px 0;
}

/* RIGHT (CHART) */
.chartContainer{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* QUAN TRỌNG: FIX CHART */
#chart{
  width:100% !important;
  height:100% !important;
  max-width:none !important; /* bỏ giới hạn cũ */
}
</style>
</head>
